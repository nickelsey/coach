# Coach backend. Nothing here publishes a port on the LAN: the only way in is
# the tailnet, through the `ts` container.
#
# One file serves every environment. On the NAS, run it through compose.sh,
# which sets the project name (coach-dev, coach-prod) and these variables.
#
# Third-party images are pinned to a version and digest, so a restart can't
# silently change them. To update one, change both.

services:
  ts:
    image: tailscale/tailscale:v1.104.4@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
    # The machine's name on the tailnet: coach for prod, coach-dev for dev.
    hostname: ${TS_HOSTNAME:-coach}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env}
      # Log in only when there's no saved state, so an expired auth key can't
      # keep the machine off the tailnet after a restart.
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ${DATA_DIR:-./data}/tailscale:/var/lib/tailscale
      # A directory, not the file, so an updated serve.json is picked up.
      - ${CONFIG_DIR:-./config}:/config:ro
    restart: unless-stopped

  db:
    image: postgres:17.11@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
    environment:
      POSTGRES_DB: coach
      POSTGRES_USER: coach
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coach -d coach"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    # On the NAS this is the image CI pushed, pinned by digest (the NAS can't
    # build). Elsewhere, compose builds it if it's missing.
    image: ${COACH_API_IMAGE:-coach-api:latest}
    build: ../server
    # Shares the ts container's network, so tailscale serve reaches it on
    # 127.0.0.1:8080 and it reaches Postgres as "db".
    network_mode: service:ts
    environment:
      DATABASE_URL: postgres://coach:${POSTGRES_PASSWORD}@db:5432/coach?sslmode=disable
      COACH_API_TOKEN: ${COACH_API_TOKEN:?set COACH_API_TOKEN in .env}
      LISTEN_ADDR: 127.0.0.1:8080
    depends_on:
      ts:
        condition: service_started
      db:
        condition: service_healthy
    restart: unless-stopped
